<script>
const SUPABASE_URL = "https://cbcqktsporbfubfyjdpd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_l9F1Q_dguZpJUs-PmimxNQ_Qq09y3Sr";
const BUCKET = "uploads";

async function loadGallery() {
  const gallery = document.getElementById("galleryGrid");

  try {
    const response = await fetch(
      `${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({
          prefix: "",
          limit: 100,
          offset: 0,
          sortBy: {
            column: "created_at",
            order: "desc"
          }
        })
      }
    );

    if (!response.ok) {
      const errorText = await response.text();
      console.error("Supabase error:", errorText);
      throw new Error("Could not load images");
    }

    const files = await response.json();

    const images = files.filter(file =>
      /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(file.name)
    );

    if (!images.length) {
      gallery.innerHTML =
        '<p class="gallerymsg">No images found.</p>';
      return;
    }

    gallery.innerHTML = "";

    images.forEach(file => {
      const imageUrl =
        `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${encodeURIComponent(file.name)}`;

      const item = document.createElement("div");
      item.className = "galleryitem";

      item.innerHTML = `
        <img src="${imageUrl}" alt="Fastnexa USA image" loading="lazy">
        <p>${file.name}</p>
      `;

      gallery.appendChild(item);
    });

  } catch (error) {
    console.error(error);

    gallery.innerHTML =
      '<p class="gallerymsg">Unable to load gallery images.</p>';
  }
}

loadGallery();
</script>
